<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CampusConnect{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body { min-height: 100vh; background: #f5f7fb; }
        main { padding-top: 2rem; padding-bottom: 3rem; }
        form p { margin-bottom: 1rem; }
        form p label { display: block; margin-bottom: .5rem; font-weight: 500; }
        form p input, form p select, form p textarea {
            display: block; width: 100%; padding: .375rem .75rem;
            font-size: 1rem; line-height: 1.5; color: #212529;
            background-color: #fff; border: 1px solid #ced4da;
            border-radius: .375rem;
        }
        form ul.errorlist { color: #b02a37; padding-left: 1.25rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="{% url 'dashboard' %}">CampusConnect</a>
            <div class="d-flex align-items-center gap-3">
                {% if user.is_authenticated %}
                    <a class="text-white text-decoration-none" href="{% url 'profile' %}">My profile</a>
                    <span class="text-white">Hi, {{ user.username }}!</span>
                    <form class="m-0" method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
                    </form>
                {% else %}
                    <a class="text-white text-decoration-none" href="{% url 'login' %}">Log in</a>
                    <a class="btn btn-light btn-sm" href="{% url 'signup' %}">Sign up</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
